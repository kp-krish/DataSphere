# nginx config for the DataSphere web container.
#
# Serves the built SPA and reverse-proxies /api to the api service, so the
# browser only ever talks to one origin and CORS never enters the picture in
# a compose deployment.
#
# Port 8080 rather than 80: this runs on nginx-unprivileged as a non-root
# user, which cannot bind ports below 1024.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Container healthcheck target. Answered by nginx itself so it stays green
    # even while the API is still starting.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass         http://api:4000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events drive the dashboards' live updates. nginx buffers
        # upstream responses by default, which would hold events until the
        # buffer filled and make "live" arrive in batches. Clearing Connection
        # keeps the upstream connection from being closed as a hop-by-hop hint.
        proxy_set_header Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # Long-lived caching for fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unmatched path is a client-side route, so hand back
    # index.html and let the router deal with it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
}
